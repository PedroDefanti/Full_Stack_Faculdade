<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Acervo{% endblock %}</title>
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">📚 Sistema de Acervo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
    <li class="nav-item">
        <a class="nav-link" href="{% url 'lista' %}">Lista de Livros</a>
    </li>
    <li class="nav-item">
        <!-- Um único botão para cadastrar tudo! -->
        <a class="nav-link" href="{% url 'novo_livro' %}">Cadastrar Item</a> 
    </li>
    <li class="nav-item">
        <a class="nav-link" href="{% url 'buscar_acervo' %}">Buscar Acervo</a>
    </li>
</ul>
            </div>
        </div>
    </nav>


    <!-- No base.html -->
<main class="container my-4">
    {% block conteudo %}
    {% endblock %}
</main>


    <footer class="text-center text-muted py-4 mt-auto border-top">
        <div class="container">
            <small>&copy; 2026 - Sistema de Gerenciamento de Acervo e Livros</small>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
