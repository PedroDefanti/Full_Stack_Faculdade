<div class="card h-100 shadow-sm border-0">
    <div class="card-header bg-white fw-semibold">{{ titulo }}</div>
    <ul class="list-group list-group-flush">
        {% for item in itens %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="text-truncate me-2"><span class="text-muted me-2">{{ forloop.counter }}.</span>{{ item.nome }}</span>
                <span class="badge bg-primary rounded-pill">{{ item.total }}</span>
            </li>
        {% empty %}
            <li class="list-group-item text-muted">Sem dados no período.</li>
        {% endfor %}
    </ul>
</div>
