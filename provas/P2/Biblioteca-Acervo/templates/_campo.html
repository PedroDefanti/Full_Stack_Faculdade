<div class="form-floating mb-1">
    {{ field }}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
</div>
{% for erro in field.errors %}
    <div class="text-danger small ms-1">{{ erro }}</div>
{% endfor %}
{% if field.help_text %}
    <div class="form-text ms-1">{{ field.help_text|safe }}</div>
{% endif %}
<div class="mb-3"></div>
