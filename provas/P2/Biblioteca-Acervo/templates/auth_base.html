<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            border: 0;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }
        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 18px;
            background: #eef2ff;
        }
        .auth-card .form-control { border-radius: 12px; }
        .auth-card .form-floating > .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.15);
        }
        .btn-auth {
            background: #4f46e5;
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-auth:hover { background: #4338ca; color: #fff; }
        .form-text ul { padding-left: 1.1rem; margin-bottom: 0; }
        .auth-link { color: #4f46e5; font-weight: 600; text-decoration: none; }
        .auth-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card auth-card">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                
                <h1 class="h4 fw-bold mb-1">{% block titulo %}{% endblock %}</h1>
                <p class="text-muted mb-0">{% block subtitulo %}{% endblock %}</p>
            </div>

            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2">{{ message }}</div>
            {% endfor %}

            {% block content %}{% endblock %}

            <p class="text-center text-muted mt-4 mb-0">{% block rodape %}{% endblock %}</p>
        </div>
    </div>

    <script>
        // "Mostrar senha": alterna todos os campos de senha da tela
        document.querySelectorAll('[data-toggle-senha]').forEach(function (caixa) {
            caixa.addEventListener('change', function () {
                document.querySelectorAll('input[name^="password"]').forEach(function (campo) {
                    campo.type = caixa.checked ? 'text' : 'password';
                });
            });
        });
    </script>
</body>
</html>
