{% extends 'base.html' %}

{% block content %}
<h2>Cadastrar Novo Livro</h2>

<form method="post" class="mt-3 col-md-6">
    {% csrf_token %}
    <div class="mb-3">
        <label for="titulo" class="form-label">Título do Livro:</label>
        <input type="text" name="titulo" id="titulo" class="form-control" placeholder="Ex: Dom Casmurro" required>
    </div>

    <div class="mb-3">
        <label for="autor_id" class="form-label">Autor:</label>
        <select name="autor_id" id="autor_id" class="form-select" required>
            <option value="">-- Selecione o Autor --</option>
            {% for autor in autores %}
                <option value="{{ autor.id }}">{{ autor.nome }}</option>
            {% endfor %}
        </select>
        <small class="text-muted">Não encontrou o autor? <a href="{% url 'cadastrar_autor' %}">Cadastre um novo autor aqui</a>.</small>
    </div>

    <button type="submit" class="btn btn-primary">Salvar e Avançar</button>
    <a href="{% url 'lista_livros' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
