{% extends 'base.html' %}

{% block content %}
<h2>Cadastrar Novo Autor</h2>

<form method="post" class="mt-3 col-md-6">
    {% csrf_token %}
    <div class="mb-3">
        <label for="nome" class="form-label">Nome do Autor:</label>
        <input type="text" name="nome" id="nome" class="form-control" placeholder="Ex: Machado de Assis" required>
    </div>
    <button type="submit" class="btn btn-primary">Salvar Autor</button>
    <a href="{% url 'lista_livros' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
