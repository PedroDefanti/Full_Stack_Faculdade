<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

    <nav class="mb-4 d-flex gap-2">
        <a href="{% url 'lista_livros' %}" class="btn btn-outline-primary">Livros / Acervo</a>
        <a href="{% url 'lista_emprestimos' %}" class="btn btn-outline-secondary">Empréstimos</a>
        
        <div class="ms-auto d-flex gap-2">
            <a href="{% url 'cadastrar_autor' %}" class="btn btn-sm btn-outline-success">+ Cadastrar Autor</a>
            <a href="{% url 'cadastrar_livro' %}" class="btn btn-sm btn-success">+ Cadastrar Livro</a>
            <a href="{% url 'cadastrar_exemplar' %}" class="btn btn-sm btn-outline-success">+ Cadastrar Exemplar</a>
        </div>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}

</body>
</html>
