{% extends 'base.html' %}

{% block content %}
<h2>Catálogo de Livros</h2>

<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for livro in livros %}
        <tr>
            <td>{{ livro.titulo }}</td>
            <td>{{ livro.autor.nome }}</td>
            <td>
                <a href="{% url 'solicitar_livro' livro.id %}" class="btn btn-sm btn-success">Emprestar / Reservar</a>
                <a href="{% url 'fila_reservas' livro.id %}" class="btn btn-sm btn-info text-white">Ver Fila de Reserva</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Nenhum livro cadastrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
