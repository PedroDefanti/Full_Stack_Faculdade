{% extends 'base.html' %}

{% block content %}
<h2>Cadastrar Novo Membro</h2>

<form method="post" class="mt-3 col-md-6">
    {% csrf_token %}
    <div class="mb-3">
        <label for="username" class="form-label">Nome do Usuário / Membro:</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="Ex: joaosilva" required>
    </div>

    <div class="mb-3">
        <label for="telefone" class="form-label">Telefone (Opcional):</label>
        <input type="text" name="telefone" id="telefone" class="form-control" placeholder="Ex: (11) 99999-9999">
    </div>

    <button type="submit" class="btn btn-primary">Salvar Membro</button>
    <a href="{% url 'lista_livros' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
